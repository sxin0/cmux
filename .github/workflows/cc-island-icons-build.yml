name: cc-island-icons-build
run-name: "CC island icons · ${{ inputs.tag }} · ${{ inputs.ref || github.ref_name }}"

# Intentionally manual and standalone: no releases, signing secrets, upstream
# reusable workflows, or the normal CI fan-out are needed in a public fork.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag, or commit (empty uses the dispatch ref)
        required: false
        default: ""
        type: string
      configuration:
        description: Native app build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      tag:
        description: Isolated development build tag (lowercase letters, digits, hyphens)
        required: true
        default: cc-island-icons
        type: string

permissions:
  contents: read

concurrency:
  group: cc-island-icons-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    # The macOS 26 arm64 pool repeatedly failed to acquire a hosted runner.
    runs-on: macos-15
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      BUILD_TAG: ${{ inputs.tag }}
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      CMUX_DEV_BACKEND_MODE: local
      # This is an installable personal build, not a bundle-shape compile check.
      CMUX_SKIP_ZIG_BUILD: "0"
      CMUX_BUILD_ARCH: arm64
      CMUX_RELOAD_APP_EMIT_MODULE: "1"
      CMUX_RELOAD_NO_GLOBAL_CLI_LINKS: "1"
      SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no

    steps:
      - name: Checkout requested source and pinned submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 200
          submodules: recursive
          persist-credentials: false

      - name: Validate tag and initialize artifact directories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cc-island-icons/logs" "$RUNNER_TEMP/cc-island-icons/app"
          if [[ ! "$BUILD_TAG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#BUILD_TAG} > 64 )); then
            printf '::error::Use a lowercase alphanumeric/hyphen tag of at most 64 characters.\n'
            exit 1
          fi
          source scripts/lib/mobile-attach.sh
          cmux_attach_validate_dev_tag "$BUILD_TAG"

      - name: Select repository-pinned Xcode major
        run: |
          set -euo pipefail
          pin_major="$(cut -d. -f1 .xcode-version)"
          CMUX_CI_MAX_MACOS_SDK_MAJOR="$pin_major" ./scripts/select-ci-xcode.sh \
            2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/xcode.log"

      - name: Setup Bun for bundled web resources
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup Go for Release tunnel extension
        if: ${{ inputs.configuration == 'Release' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Provision Rust for bundled native helpers
        run: |
          set -euo pipefail
          ./scripts/install-rust-ci.sh 2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/rust.log"

      - name: Download checksum-verified prebuilt GhosttyKit (no Zig build)
        timeout-minutes: 10
        env:
          GHOSTTYKIT_DOWNLOAD_RETRIES: "2"
          GHOSTTYKIT_DOWNLOAD_RETRY_DELAY: "5"
          GHOSTTYKIT_DOWNLOAD_MAX_TIME: "240"
        run: |
          set -euo pipefail
          ./scripts/download-prebuilt-ghosttykit.sh \
            2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/ghosttykit.log"
          test -d GhosttyKit.xcframework

      - name: Resolve repository-pinned Ghostty Zig version
        id: ghostty-zig-version
        run: |
          set -euo pipefail
          version="$(bash scripts/ghostty-zig-version.sh)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned Zig for real native helpers
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Build exact-source cmux-tui client
        timeout-minutes: 60
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          unset CMUX_GHOSTTY_SRC
          export CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          export CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty rev-parse HEAD)"
          target="$(rustc -vV | grep '^host: ' | cut -d' ' -f2)"
          case "$target" in
            aarch64-apple-darwin) native_arch=arm64 ;;
            x86_64-apple-darwin) native_arch=x86_64 ;;
            *) printf 'Unsupported native target: %s\n' "$target" >&2; exit 1 ;;
          esac
          [[ "$(uname -m)" == "$native_arch" ]]
          [[ "$native_arch" == "$CMUX_BUILD_ARCH" ]]
          rustup target add "$target"
          cargo build -p cmux-tui --bin cmux-tui --release --locked --target "$target" \
            2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/cmux-tui-build.log"
          client="$GITHUB_WORKSPACE/cmux-tui/target/$target/release/cmux-tui"
          test -x "$client"
          lipo "$client" -verify_arch "$native_arch"
          PROBE="$("$client" remote-probe --json)" VERSION="$("$client" --version)" \
            python3 -I - <<'PY'
          import json
          import os
          probe = json.loads(os.environ["PROBE"])
          if probe.get("app") != "cmux-tui" or probe.get("build_identity") != os.environ["CMUX_TUI_BUILD_COMMIT"]:
              raise SystemExit("cmux-tui build identity mismatch")
          if os.environ["CMUX_TUI_GHOSTTY_COMMIT"] not in os.environ["VERSION"]:
              raise SystemExit("cmux-tui Ghostty identity mismatch")
          if not {"wireguard-hub", "browser-proxy"}.issubset(probe.get("capabilities", [])):
              raise SystemExit("cmux-tui required capabilities missing")
          PY
          printf 'CMUX_TUI_CLIENT_LOCAL=%s\n' "$client" >> "$GITHUB_ENV"
          printf 'CMUX_PERSONAL_NATIVE_ARCH=%s\n' "$native_arch" >> "$GITHUB_ENV"
          printf '%s\n' "$CMUX_TUI_BUILD_COMMIT" > "$RUNNER_TEMP/cc-island-icons/logs/cmux-tui-commit.txt"

      - name: Restore fork-local native build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/cc-island-derived-data
            ${{ runner.temp }}/cc-island-source-packages
          key: cc-island-personal-arm64-v4-${{ inputs.configuration || 'Debug' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-version', 'cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            cc-island-personal-arm64-v4-${{ inputs.configuration || 'Debug' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-version', 'cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Build tagged app and bundled CLI without launching
        id: build
        timeout-minutes: 180
        env:
          CMUX_GHOSTTYKIT_PREPROVISIONED: "1"
          CMUX_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/cc-island-source-packages
        run: |
          set -euo pipefail
          build_flags=()
          if [[ "$BUILD_CONFIGURATION" == Release ]]; then build_flags+=(--release); fi
          ./scripts/reload.sh --tag "$BUILD_TAG" ${build_flags[@]+"${build_flags[@]}"} \
            --derived-data "$RUNNER_TEMP/cc-island-derived-data" \
            --swift-frontend-workaround \
            2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/reload-console.log"

      # Archive immediately after the build, before test failures can occur.
      # Only the tagged app is included; never upload HOME, source, DerivedData,
      # credentials, or a whole temporary directory.
      - name: Validate tagged bundle and archive app plus bundled CLI
        id: archive
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/cc-island-derived-data/Build/Products/$BUILD_CONFIGURATION/cmux DEV $BUILD_TAG.app"
          test -d "$app"
          test -x "$app/Contents/Resources/bin/cmux"
          source scripts/lib/mobile-attach.sh
          expected_bundle="$(cmux_attach_mac_bundle_id "$BUILD_TAG")"
          actual_bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          [[ "$actual_bundle" == "$expected_bundle" ]]
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          [[ "$(lipo "$app/Contents/MacOS/$executable" -archs)" == "$CMUX_BUILD_ARCH" ]]
          [[ "$(lipo "$app/Contents/Resources/bin/cmux" -archs)" == "$CMUX_BUILD_ARCH" ]]
          DYLD_FRAMEWORK_PATH="$app/Contents/Frameworks:$RUNNER_TEMP/cc-island-derived-data/Build/Products/$BUILD_CONFIGURATION" \
            "$app/Contents/Resources/bin/cmux" --help \
            > "$RUNNER_TEMP/cc-island-icons/logs/cli-help.txt"
          logs="$RUNNER_TEMP/cc-island-icons/logs"
          client="$app/Contents/Resources/bin/cmux-tui"
          lipo "$client" -verify_arch "$CMUX_PERSONAL_NATIVE_ARCH"
          PROBE="$("$client" remote-probe --json)" VERSION="$("$client" --version)" \
            EXPECTED_COMMIT="$(git rev-parse HEAD)" EXPECTED_GHOSTTY="$(git -C ghostty rev-parse HEAD)" \
            python3 -I - <<'PY'
          import json
          import os
          probe = json.loads(os.environ["PROBE"])
          if probe.get("app") != "cmux-tui" or probe.get("build_identity") != os.environ["EXPECTED_COMMIT"]:
              raise SystemExit("bundled cmux-tui build identity mismatch")
          if os.environ["EXPECTED_GHOSTTY"] not in os.environ["VERSION"]:
              raise SystemExit("bundled cmux-tui Ghostty identity mismatch")
          if not {"wireguard-hub", "browser-proxy"}.issubset(probe.get("capabilities", [])):
              raise SystemExit("bundled cmux-tui required capabilities missing")
          PY
          GHOSTTY_RESOURCES_DIR="$app/Contents/Resources/ghostty" \
            "$app/Contents/Resources/bin/ghostty" +list-themes --plain > "$logs/ghostty-themes.txt"
          test -s "$logs/ghostty-themes.txt"
          codesign --verify --deep --strict "$app"
          find "$app/Contents/MacOS" "$app/Contents/Resources/bin" \
            "$app/Contents/Library" "$app/Contents/Frameworks" \
            -type f -perm -111 -print0 > "$RUNNER_TEMP/cc-island-native-files"
          while IFS= read -r -d '' binary; do
            description="$(file -b "$binary")"
            if [[ "$description" == *Mach-O* ]]; then
              printf '%s: %s\n' "${binary#"$app"/}" "$description"
              lipo "$binary" -verify_arch "$CMUX_PERSONAL_NATIVE_ARCH"
            fi
          done < "$RUNNER_TEMP/cc-island-native-files" > "$logs/native-architectures.txt"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$RUNNER_TEMP/cc-island-icons/app/cmux-$BUILD_TAG.zip"
          shasum -a 256 "$RUNNER_TEMP/cc-island-icons/app/cmux-$BUILD_TAG.zip" \
            > "$RUNNER_TEMP/cc-island-icons/app/SHA256SUMS"

      - name: Verify two foreground tabs in one workspace against the built app
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Developer/Xcode/DerivedData"
          ln -s "$RUNNER_TEMP/cc-island-derived-data" "$HOME/Library/Developer/Xcode/DerivedData/cmux-$BUILD_TAG"
          if [[ "$BUILD_CONFIGURATION" == Release ]]; then
            app="$RUNNER_TEMP/cc-island-derived-data/Build/Products/Release/cmux DEV $BUILD_TAG.app"
            env -u CMUX_SOCKET -u CMUX_WORKSPACE_ID -u CMUX_SURFACE_ID -u CMUX_SOCKET_PASSWORD \
              CMUX_SOCKET_PATH="/tmp/cmux-debug-$BUILD_TAG.sock" CMUX_SOCKET_MODE=automation \
              CMUX_DISABLE_SESSION_RESTORE=1 open -g "$app"
            for attempt in {1..150}; do
              [[ -S "/tmp/cmux-debug-$BUILD_TAG.sock" ]] && break
              sleep 0.2
            done
            test -S "/tmp/cmux-debug-$BUILD_TAG.sock"
          else
            ./scripts/launch-tagged-automation.sh "$BUILD_TAG" --wait-socket 30 \
              2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/multi-tab-launch.log"
          fi
          CMUX_SOCKET_PATH="/tmp/cmux-debug-$BUILD_TAG.sock" \
            python3 -I tests_v2/test_surface_icon_multiple_tabs.py \
            2>&1 | tee "$RUNNER_TEMP/cc-island-icons/logs/multi-tab-regression.log"

      - name: Run focused control-socket icon parser and dispatch tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cc-island-icons/logs/control-socket-tests.log"
          swift test --package-path Packages/macOS/CmuxControlSocket \
            --filter ControlCommandCoordinatorSurfaceIconTests 2>&1 | tee "$log"
          # Swift Testing can exit successfully with no matching tests.
          grep -Eq 'Test run with [1-9][0-9]* tests? .*passed' "$log"

      - name: Run focused Bonsplit icon model and animation tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cc-island-icons/logs/bonsplit-icon-tests.log"
          swift test --package-path vendor/bonsplit \
            --filter 'TabIconAnimationTests|AnimatedTabIconNSViewTests' 2>&1 | tee "$log"
          grep -Eq 'Test run with [1-9][0-9]* tests? .*passed' "$log"

      - name: Collect bounded build logs and source metadata
        if: ${{ always() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/cc-island-icons/logs"
          mkdir -p "$logs"
          # reload.sh redirects its detailed compiler output to this exact file.
          if [[ "$BUILD_TAG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && (( ${#BUILD_TAG} <= 64 )); then
            if [[ -f "/tmp/cmux-reload-$BUILD_TAG.log" ]]; then
              cp "/tmp/cmux-reload-$BUILD_TAG.log" "$logs/reload-build.log"
            fi
          fi
          python3 -I - <<'PY' > "$logs/build-metadata.json"
          import json
          import os
          import subprocess
          def git(*args):
              result = subprocess.run(["git", *args], capture_output=True, text=True)
              return result.stdout.strip() if result.returncode == 0 else None
          json.dump({
              "source_commit": git("rev-parse", "HEAD"),
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "requested_ref": os.environ["REQUESTED_REF"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "submodules": git("submodule", "status", "--recursive"),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "tag": os.environ["BUILD_TAG"],
              "backend_mode": "local",
              "build_outcome": os.environ["BUILD_OUTCOME"],
              "archive_outcome": os.environ["ARCHIVE_OUTCOME"],
              "app_tests": "Not run: focused package tests only; app build does not compile cmuxTests.",
              "distribution": "Tagged ad-hoc-signed " + os.environ["BUILD_CONFIGURATION"] + " app; not notarized or an official release.",
          }, __import__("sys").stdout, indent=2)
          PY
          {
            printf '### CC island icons build\n\n'
            printf -- '- App build: `%s`; archive: `%s`.\n' "$BUILD_OUTCOME" "$ARCHIVE_OUTCOME"
            printf -- '- Bundled CLI is inside the app artifact; compiler/test logs are separate.\n'
            printf -- '- Local backend mode; no backend server or authenticated session is provisioned.\n'
            printf -- '- Focused package tests only; app-level cmuxTests are not compiled or executed.\n'
            printf -- '- Tagged ad-hoc app, not notarized; no official release is published.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tagged app and bundled CLI even if subsequent tests fail
        if: ${{ always() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc-island-icons-app-${{ inputs.tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cc-island-icons/app/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Preserve native build cache after a compile attempt
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/cc-island-derived-data
            ${{ runner.temp }}/cc-island-source-packages
          key: cc-island-personal-arm64-v4-${{ inputs.configuration || 'Debug' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-version', 'cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}

      - name: Upload build and focused-test logs on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc-island-icons-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/cc-island-icons/logs/
          retention-days: 7
          if-no-files-found: error
